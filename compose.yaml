services:
  backend:
    build: ./backend
    environment:
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_PLANNING_MODEL: ${GEMINI_PLANNING_MODEL:-}
      GEMINI_FAST_PLANNING_MODEL: ${GEMINI_FAST_PLANNING_MODEL:-gemini-3.5-flash-lite}
      GEMINI_RESEARCH_MODEL: ${GEMINI_RESEARCH_MODEL:-}
      GEMINI_VERIFICATION_MODEL: ${GEMINI_VERIFICATION_MODEL:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      CHAT_DATABASE_PATH: /data/chats.sqlite3
      BROWSER_ENABLED: ${BROWSER_ENABLED:-false}
      BROWSER_BACKEND: ${BROWSER_BACKEND:-oxylabs}
      OXY_AB_USERNAME: ${OXY_AB_USERNAME:-}
      OXY_AB_PASSWORD: ${OXY_AB_PASSWORD:-}
      OXYLAB_KEY: ${OXYLAB_KEY:-}
      OXYLABS_WEB_API_KEY: ${OXYLABS_WEB_API_KEY:-}
      BROWSER_COUNTRY: ${BROWSER_COUNTRY:-}
      BROWSER_MODEL: ${BROWSER_MODEL:-gemini-3.5-flash-lite}
      BROWSER_SESSION_KEY: ${BROWSER_SESSION_KEY:-}
      BROWSER_HEADLESS: ${BROWSER_HEADLESS:-true}
      BROWSER_DEADLINE_S: ${BROWSER_DEADLINE_S:-1800}
      BROWSER_IDLE_TIMEOUT_S: ${BROWSER_IDLE_TIMEOUT_S:-60}
      BROWSER_MAX_STEPS: ${BROWSER_MAX_STEPS:-120}
      BROWSER_REQUEST_TIMEOUT_S: ${BROWSER_REQUEST_TIMEOUT_S:-900}
      BROWSER_TOOL_RETRIES: ${BROWSER_TOOL_RETRIES:-5}
      BROWSER_THINKING_LEVEL: ${BROWSER_THINKING_LEVEL:-minimal}
      BROWSER_MODEL_MAX_TOKENS: ${BROWSER_MODEL_MAX_TOKENS:-8192}
      BROWSER_MODEL_TIMEOUT_S: ${BROWSER_MODEL_TIMEOUT_S:-180}
      BROWSER_FINAL_ACTION_PATTERNS: ${BROWSER_FINAL_ACTION_PATTERNS:-}
    volumes:
      - chats-data:/data
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18001}:8000"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
  worker:
    build: ./backend
    command: ["/app/.venv/bin/python", "-m", "app.worker"]
    init: true
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_PLANNING_MODEL: ${GEMINI_PLANNING_MODEL:-}
      GEMINI_FAST_PLANNING_MODEL: ${GEMINI_FAST_PLANNING_MODEL:-gemini-3.5-flash-lite}
      GEMINI_RESEARCH_MODEL: ${GEMINI_RESEARCH_MODEL:-}
      GEMINI_VERIFICATION_MODEL: ${GEMINI_VERIFICATION_MODEL:-}
      GEMINI_DECISION_MODEL: ${GEMINI_DECISION_MODEL:-gemini-decision-1}
      EXA_API_KEY: ${EXA_API_KEY:-}
      CHAT_DATABASE_PATH: /data/chats.sqlite3
      BROWSER_ENABLED: ${BROWSER_ENABLED:-false}
      BROWSER_BACKEND: ${BROWSER_BACKEND:-oxylabs}
      OXY_AB_USERNAME: ${OXY_AB_USERNAME:-}
      OXY_AB_PASSWORD: ${OXY_AB_PASSWORD:-}
      OXYLAB_KEY: ${OXYLAB_KEY:-}
      OXYLABS_WEB_API_KEY: ${OXYLABS_WEB_API_KEY:-}
      BROWSER_COUNTRY: ${BROWSER_COUNTRY:-}
      BROWSER_MODEL: ${BROWSER_MODEL:-gemini-3.5-flash-lite}
      BROWSER_SESSION_KEY: ${BROWSER_SESSION_KEY:-}
      BROWSER_HEADLESS: ${BROWSER_HEADLESS:-true}
      BROWSER_DEADLINE_S: ${BROWSER_DEADLINE_S:-1800}
      BROWSER_IDLE_TIMEOUT_S: ${BROWSER_IDLE_TIMEOUT_S:-60}
      BROWSER_MAX_STEPS: ${BROWSER_MAX_STEPS:-120}
      BROWSER_REQUEST_TIMEOUT_S: ${BROWSER_REQUEST_TIMEOUT_S:-900}
      BROWSER_TOOL_RETRIES: ${BROWSER_TOOL_RETRIES:-5}
      BROWSER_THINKING_LEVEL: ${BROWSER_THINKING_LEVEL:-minimal}
      BROWSER_MODEL_MAX_TOKENS: ${BROWSER_MODEL_MAX_TOKENS:-8192}
      BROWSER_MODEL_TIMEOUT_S: ${BROWSER_MODEL_TIMEOUT_S:-180}
      BROWSER_FINAL_ACTION_PATTERNS: ${BROWSER_FINAL_ACTION_PATTERNS:-}
    volumes:
      - chats-data:/data
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-18000}:8080"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  chats-data:
