[project]
name = "guuey-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=46,<51",
    "fastapi>=0.115,<1",
    "google-genai>=2.34,<3",
    "httpx>=0.28,<1",
    "markdown-it-py>=3,<5",
    "pydantic>=2.10,<3",
    "pydantic-ai-slim[google,mcp]>=2.68,<3",
    "patchright>=1.64.4,<1.65",
    "playwright>=1.62,<2",
    "tldextract>=5.3,<6",
    "uvicorn[standard]>=0.34,<1",
    "pwdlib[argon2]>=0.3,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
